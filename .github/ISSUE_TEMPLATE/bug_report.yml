name: Bug 报告
description: 报告可以稳定复现的问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 感谢反馈。请先移除示例文件中的敏感信息。
  - type: input
    id: environment
    attributes:
      label: 环境
      description: 操作系统和浏览器版本
      placeholder: Windows 11 / Chrome 130
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请提供最小、清晰的操作步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: 最小 Markdown 示例
      render: markdown
