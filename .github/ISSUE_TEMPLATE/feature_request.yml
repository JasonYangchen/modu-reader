name: 功能建议
description: 提议一个聚焦且符合本地优先原则的功能
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 请描述使用场景，而不只是解决方案
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方式
  - type: checkboxes
    id: principles
    attributes:
      label: 项目原则
      options:
        - label: 该功能不要求上传用户文档
          required: true
        - label: 该功能不要求在线运行时依赖
          required: true
